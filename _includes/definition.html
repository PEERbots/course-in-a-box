{% assign def_slug = include.term | slugify %}
{% capture def_id %}def-item-{{ page_def_container_id | default: "page" }}-{{ def_slug }}{% endcapture %}

<div class="definition-item border-bottom">
    <button class="definition-trigger d-flex justify-content-between align-items-center w-100 py-3 px-4 text-left border-0 bg-transparent" 
            type="button" 
            aria-expanded="false" 
            aria-controls="{{ def_id }}">
        <span class="definition-term font-weight-bold text-dark">{{ include.term }}</span>
        <span class="definition-icon text-muted small">
            <i class="fa fa-chevron-down"></i>
        </span>
    </button>
    <div id="{{ def_id }}" class="definition-content-wrapper" style="max-height: 0; overflow: hidden; transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1);">
        <div class="definition-content px-4 pb-3 text-muted">
            {{ include.definition | default: include.description | markdownify }}
        </div>
    </div>
</div>
