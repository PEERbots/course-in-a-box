{% capture unique_id %}def-container-{{ page.url | slugify }}{% endcapture %}
{% assign page_def_container_id = unique_id %}

<div class="definitions-container card shadow-sm border my-4" id="{{ page_def_container_id }}">
    <!-- Header Controls -->
    <div class="definitions-header bg-light d-flex justify-content-between align-items-center py-3 px-4 border-bottom">
        <div class="d-flex align-items-center">
            <span class="mr-2 text-primary" style="font-size: 1.2rem;" aria-hidden="true">
                <i class="fa fa-book"></i>
            </span>
            <h5 class="mb-0 font-weight-normal text-dark">{{ include.title | default: "Key Definitions" }}</h5>
        </div>
        <div class="definitions-controls btn-group btn-group-sm">
            <button class="btn btn-outline-primary expand-all-btn" type="button">
                <i class="fa fa-expand mr-1"></i> Show All
            </button>
            <button class="btn btn-outline-secondary collapse-all-btn" type="button">
                <i class="fa fa-compress mr-1"></i> Hide All
            </button>
        </div>
    </div>

    <!-- Definitions List -->
    <div class="definitions-list bg-white">
